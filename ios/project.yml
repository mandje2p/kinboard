# Generates KinboardShell.xcodeproj:  brew install xcodegen && xcodegen generate
# (see README.md). The Info.plist and entitlements are generated from here.
name: KinboardShell
options:
  bundleIdPrefix: fr.2points
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "2"        # iPad only
    CODE_SIGN_STYLE: Automatic
    # Pick your team in Xcode (Signing & Capabilities), or run:
    #   DEVELOPMENT_TEAM=XXXXXXXXXX xcodegen generate
    DEVELOPMENT_TEAM: "${DEVELOPMENT_TEAM}"
targets:
  KinboardShell:
    type: application
    platform: iOS
    sources:
      - path: KinboardShell
        excludes:
          - Info.plist
          - KinboardShell.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.2points.kinboard
        PRODUCT_NAME: Kinboard
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: "NO"
    info:
      path: KinboardShell/Info.plist
      properties:
        CFBundleDisplayName: Kinboard
        NSHomeKitUsageDescription: "Kinboard affiche et commande vos lumières, prises et thermostats Apple Home."
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: KinboardShell/KinboardShell.entitlements
      properties:
        com.apple.developer.homekit: true
